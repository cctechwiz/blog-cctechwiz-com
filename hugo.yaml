baseURL: https://blog.cctechwiz.com/
locale: en-us
title: CCTechWiz

module:
  imports:
    - path: github.com/joeroe/risotto

capitalizeListTitles: false

# By default a page with no date uses lastmod, so Uses and Books would show
# a Published line after their first edit.
frontmatter:
  date: ["date", "publishDate"]

markup:
  highlight:
    noClasses: false

params:
  theme:
    palette: "everforest"

  about:
    title: CCTechWiz
    description: "Exploring the craft of Engineering, from Security and DevX to DevOps and AI. A personal blog by Josh Maxwell."

  author:
    email: jmaxwell@cctechwiz.com
    name: Josh Maxwell

  socialLinks:
    - icon: "fa-brands fa-github"
      title: "GitHub"
      url: "https://github.com/cctechwiz"
    - icon: "fa-brands fa-mastodon"
      title: "Mastodon"
      url: "https://fosstodon.org/@cctechwiz"
    - icon: "fa-solid fa-envelope"
      title: "Email"
      url: "mailto:jmaxwell@cctechwiz.com"

menu:
  main:
    - identifier: "posts"
      name: "Posts"
      url: "/posts/"
      weight: 1
    - identifier: "tags"
      name: "Tags"
      url: "/tags/"
      weight: 2
    - identifier: "series"
      name: "Series"
      url: "/series/"
      weight: 3
    - identifier: "uses"
      name: "Uses"
      url: "/uses/"
      weight: 4
    - identifier: "books"
      name: "Books"
      url: "/books/"
      weight: 5
 
taxonomies:
  tag: "tags"
  series: "series"

# Uses and Books stay out of feeds. Without this, Hugo writes empty index.xml
# files for them, including under by-title and by-author.
cascade:
  - target:
      path: "{/uses,/uses/**,/books,/books/**}"
    outputs: [html]

copyright: "© 2023-{year} Josh Maxwell"
