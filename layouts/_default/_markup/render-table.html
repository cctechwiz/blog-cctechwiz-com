{{- /* Hugo's default table output aligns columns with inline styles, which the CSP in static/_headers blocks. */ -}}
<table
  {{- range $k, $v := .Attributes }}
    {{- if $v }}
      {{- printf " %s=%q" $k $v | safeHTMLAttr }}
    {{- end }}
  {{- end }}>
  <thead>
    {{- range .THead }}
      <tr>
        {{- range . }}
          <th{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
      <tr>
        {{- range . }}
          <td{{ with .Alignment }} class="align-{{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
    {{- end }}
  </tbody>
</table>
